name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Sync backend environment
        run: cd backend && UV_PROJECT_ENVIRONMENT=$GITHUB_WORKSPACE/.venv uv sync --extra dev
      - name: Lint and type-check
        run: |
          cd backend
          ../.venv/bin/ruff check src tests
          ../.venv/bin/ruff format --check src tests
          ../.venv/bin/mypy
      - name: Tests (CP-PAW executable not available on CI)
        run: cd backend && ../.venv/bin/python -m pytest -q -m "not cppaw" --basetemp=../.scratch/pytest
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: cd frontend && pnpm install --frozen-lockfile
      - run: cd frontend && pnpm typecheck && pnpm lint && pnpm test && pnpm build
