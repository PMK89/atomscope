name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Sync backend environment
        run: cd backend && UV_PROJECT_ENVIRONMENT=$GITHUB_WORKSPACE/.venv uv sync --extra dev
      - name: Lint and type-check
        run: |
          cd backend
          ../.venv/bin/ruff check src tests
          ../.venv/bin/ruff format --check src tests
          ../.venv/bin/mypy
      - name: Tests (CP-PAW executable not available on CI)
        run: cd backend && ../.venv/bin/python -m pytest -q -m "not cppaw" --basetemp=../.scratch/pytest
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # `cache: pnpm` on setup-node cannot be used here: it locates the store by running
      # `pnpm store path` from the repository root, where frontend/.npmrc -- which points the
      # store at .pnpm-store inside the project -- does not apply. It therefore caches a
      # directory that `pnpm install` never creates, and its post-job save step fails the whole
      # job with "Path(s) specified in the action for caching do(es) not exist". Cache the store
      # that is actually used.
      - uses: actions/cache@v4
        with:
          path: .pnpm-store
          key: pnpm-${{ runner.os }}-${{ hashFiles('frontend/pnpm-lock.yaml') }}
          restore-keys: pnpm-${{ runner.os }}-
      - run: cd frontend && pnpm install --frozen-lockfile
      - run: cd frontend && pnpm typecheck && pnpm lint && pnpm test && pnpm build
