[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "atomscope"
version = "0.1.0"
description = "Atomscope scientific backend: molecular data model, ASE bridge, CP-PAW adapter, job execution, parsers and API"
readme = "README.md"
license = "GPL-3.0-or-later"
requires-python = ">=3.12,<3.13"
authors = [{ name = "Patrick M. Kaiser" }]
dependencies = [
  "ase>=3.25,<3.27",
  "numpy>=2.0,<3",
  "scipy>=1.14,<2",
  "pydantic>=2.9,<3",
  "pydantic-settings>=2.6,<3",
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.32,<1",
  "python-multipart>=0.0.12",
  "websockets>=13",
  "rdkit>=2024.9",
  "openbabel-wheel>=3.1.1.21",
  "spglib>=2.5",
  "typer>=0.12",
  "rich>=13",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "pytest-cov>=5",
  "httpx>=0.27",
  "ruff>=0.7",
  "mypy>=1.13",
  "hypothesis>=6.115",
]

[project.scripts]
atomscope = "atomscope.cli:main"

[project.entry-points."atomscope.backends"]
cppaw = "atomscope.backends.cppaw:plugin"

[tool.hatch.build.targets.wheel]
packages = ["src/atomscope"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = ["cppaw: runs the real CP-PAW executable (slow; skipped when unavailable)"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "W", "ANN", "S", "PL"]
ignore = ["ANN401", "PLR0913", "PLR2004", "S101"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["atomscope"]
mypy_path = "src"

[[tool.mypy.overrides]]
# ASE ships no type annotations; calls into it cannot be type-checked.
module = ["atomscope.ase_bridge.*", "atomscope.io.*", "atomscope.chem.*", "atomscope.backends.ase_builtin.runner"]
disallow_untyped_calls = false

[[tool.mypy.overrides]]
module = ["openbabel.*", "rdkit.*"]
ignore_missing_imports = true
